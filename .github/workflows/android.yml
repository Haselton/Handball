name: Build Android Services

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production requires all real service IDs
        type: choice
        options: [diagnostic, production]
        default: diagnostic
  push:
    branches: [main, codex/fix-production-services]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVICE_MODE: ${{ github.event.inputs.mode || (github.ref == 'refs/heads/main' && 'production' || 'diagnostic') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36 platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - name: Restore persistent Handball upload key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/handball-debug.keystore.b64 > "$HOME/.android/handball-upload.keystore"
          keytool -list \
            -keystore "$HOME/.android/handball-upload.keystore" \
            -storepass android \
            -alias handballdebug
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/handball-upload.keystore\"" \
            'export/android/debug_keystore_user = "handballdebug"' \
            'export/android/debug_keystore_pass = "android"' \
            "export/android/release_keystore = \"$HOME/.android/handball-upload.keystore\"" \
            'export/android/release_keystore_user = "handballdebug"' \
            'export/android/release_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          mkdir -p build/android
      - name: Install AdMob and Android build templates
        run: |
          work_dir="$(mktemp -d)"
          curl -L --retry 3 -o "$work_dir/admob.zip" https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/poing-godot-admob-v5.1.0.zip
          unzip -q "$work_dir/admob.zip" -d "$work_dir/admob"
          mkdir -p addons
          cp -R "$work_dir/admob/poing-godot-admob/addons/admob" addons/admob
          curl -L --retry 3 -o "$work_dir/admob-android.zip" https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/android-template-v4.7.2.zip
          mkdir -p addons/admob/android/bin
          unzip -q "$work_dir/admob-android.zip" -d addons/admob/android/bin
          curl -L --retry 3 -o "$work_dir/templates.tpz" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$work_dir/templates.tpz" -d "$work_dir/templates"
          source_zip="$(find "$work_dir/templates" -type f -name android_source.zip -print -quit)"
          test -n "$source_zip"
          mkdir -p "$work_dir/android-source" android/build
          unzip -q "$source_zip" -d "$work_dir/android-source"
          settings_gradle="$(find "$work_dir/android-source" -type f -name settings.gradle -print -quit)"
          test -n "$settings_gradle"
          template_root="$(dirname "$settings_gradle")"
          cp -R "$template_root"/. android/build/
          printf '%s\n' '4.7.2.stable' > android/.build_version
      - name: Test service configuration and release gate
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install and configure native Play Games
        env:
          PLAY_GAMES_APP_ID: ${{ vars.PLAY_GAMES_APP_ID }}
          PLAY_GAMES_LEADERBOARD_ID: ${{ vars.PLAY_GAMES_LEADERBOARD_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
        run: python ci/configure_services.py --mode "$SERVICE_MODE"
      - name: Export Handball release AAB
        id: export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/handball-upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: handballdebug
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: false
          verbose: true
          cache: true
          presets_to_export: Android Release
      - name: Verify packaged native services
        run: |
          aab_path="$(find "$HOME/.local/share/godot/builds" build/android -type f -name '*.aab' -print -quit)"
          test -n "$aab_path"
          cp "$aab_path" build/android/Handball-release.aab
          test -s build/android/Handball-release.aab
          unzip -p build/android/Handball-release.aab base/manifest/AndroidManifest.xml > /dev/null
          python ci/verify_services_bundle.py build/android/Handball-release.aab
          if [ "$SERVICE_MODE" = diagnostic ]; then
            mv build/android/Handball-release.aab build/android/Handball-diagnostic.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Handball-${{ env.SERVICE_MODE }}-aab
          path: build/android/*.aab
          if-no-files-found: error
