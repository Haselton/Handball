name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' +            '[gd_resource type="EditorSettings" format=3]' +            '' +            '[resource]' +            "export/android/android_sdk_path = \"$ANDROID_HOME\"" +            "export/android/java_sdk_path = \"$JAVA_HOME\"" +            > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Export Handball APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: true
          verbose: true
          cache: true
          presets_to_export: Android Debug
      - uses: actions/upload-artifact@v4
        with:
          name: Handball-debug-apk
          path: build/android/Handball-debug.apk
