name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - name: Restore persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/handball-debug.keystore.b64 > "$HOME/.android/handball-debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/handball-debug.keystore" \
            -storepass android \
            -alias handballdebug
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/handball-debug.keystore\"" \
            'export/android/debug_keystore_user = "handballdebug"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.5.tres"
          mkdir -p build/android
      - name: Install AdMob and Android build templates
        run: |
          work_dir="$(mktemp -d)"
          curl -L --retry 3 -o "$work_dir/admob.zip" https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/poing-godot-admob-v5.1.0.zip
          unzip -q "$work_dir/admob.zip" -d "$work_dir/admob"
          mkdir -p addons
          cp -R "$work_dir/admob/poing-godot-admob/addons/admob" addons/admob
          curl -L --retry 3 -o "$work_dir/admob-android.zip" https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.1.0/android-template-v4.5.1.zip
          mkdir -p addons/admob/android/bin
          unzip -q "$work_dir/admob-android.zip" -d addons/admob/android/bin
          curl -L --retry 3 -o "$work_dir/templates.tpz" https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q "$work_dir/templates.tpz" -d "$work_dir/templates"
          source_zip="$(find "$work_dir/templates" -type f -name android_source.zip -print -quit)"
          test -n "$source_zip"
          mkdir -p "$work_dir/android-source" android/build
          unzip -q "$source_zip" -d "$work_dir/android-source"
          settings_gradle="$(find "$work_dir/android-source" -type f -name settings.gradle -print -quit)"
          test -n "$settings_gradle"
          template_root="$(dirname "$settings_gradle")"
          cp -R "$template_root"/. android/build/
      - name: Export Handball APK
        id: export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/handball-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: handballdebug
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          export_debug: true
          verbose: true
          cache: true
          presets_to_export: Android Debug
      - name: Collect APK
        run: |
          apk_path="$(find "$HOME/.local/share/godot/builds" -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" build/android/Handball-debug.apk
          test -s build/android/Handball-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Handball-debug-apk
          path: build/android/Handball-debug.apk
          if-no-files-found: error
